# A schema loaded by path rather than through a profile — the one fixture for
# `loadSchemaFromPath`. It carried PLANNING and EXECUTION in uppercase, and a
# transition to a stage it never declared, long after the stage model renamed
# and restructured both.
stages:
  planning:
    dispatch:
      strategy: serial
  execution: {}
transitions:
  - from: planning
    to: execution
    guard: "session.approved('plan')"
editingAgents: ['architect']
