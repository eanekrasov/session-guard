gates:
  - id: review
  - id: qa
  - id: invariants
stages:
  execution:
    loop: implementation
    dispatch:
      strategy: serial
    retryBudget:
      maximum: 3
    stages:
      code:
        allowedAgents: ['code']
      verify:
        allowedAgents: ['review', 'qa']
        gates: [review, qa]
    transitions:
      - from: code
        to: verify
        effects:
          - approve: release
      - from: verify
        to: done
        consent: release
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
