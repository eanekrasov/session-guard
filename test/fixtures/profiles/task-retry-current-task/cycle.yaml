# `loop: $currentTask.id` makes the loop cycle over the task list named by the
# task being moved, rather than a fixed one.
stages:
  execution:
    loop: $currentTask.id
    dispatch:
      strategy: serial
    retryBudget:
      maximum: 1
    stages:
      dev:
        allowedAgents: ['code']
      review:
        allowedAgents: ['review']
      qa:
        allowedAgents: ['qa']
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
