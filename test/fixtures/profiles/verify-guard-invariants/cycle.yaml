extends: 'verify-default/cycle.yaml'
# A task may not reach the verifiers until the session's invariants gate is
# green — the guard base.yaml uses on the same edge.
stages:
  execution:
    transitions:
      - from: code
        to: verify
        guard: "session.gates.invariants == 'passed'"
      - from: verify
        to: done
        guard: "task.gates.review == 'passed' && task.gates.qa == 'passed'"
