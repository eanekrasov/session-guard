extends: 'cycle-code/cycle.yaml'
# Задача заканчивается только когда вердикт ядра о её собственном ходе
# зелёный. `checks`, а не гейт: гейт агент выставил бы себе сам.
stages:
  execution:
    stages:
      code:
        allowedAgents: ['coder']
    transitions:
      - from: code
        to: done
        guard: "task.checks == 'passed'"
