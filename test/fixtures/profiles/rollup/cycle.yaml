stages:
  execution:
    loop: implementation
    dispatch:
      strategy: serial
    stages:
      code:
        allowedAgents: ['coder']
    transitions:
      - from: code
        to: done
        guard: "task.gates.invariants == 'passed'"
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
