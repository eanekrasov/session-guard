# A serial loop whose single stage is named `code`. Its own tests never dispatch
# to it directly; it exists so the profiles that do can say what they add.
stages:
  execution:
    loop: implementation
    dispatch:
      strategy: serial
    stages:
      code:
        allowedAgents: ['code']
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
