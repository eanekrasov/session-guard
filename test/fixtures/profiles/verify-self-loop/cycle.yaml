gates:
  - id: review
  - id: qa
  - id: invariants
stages:
  execution:
    loop: implementation
    dispatch:
      strategy: serial
    retryBudget:
      maximum: 3
    stages:
      code:
        allowedAgents: ['code']
      verify:
        allowedAgents: ['review', 'qa']
        gates: [review, qa]
    transitions:
      - from: code
        to: verify
      - from: verify
        to: verify
        guard: "task.gates.review == 'failed' || task.gates.qa == 'failed'"
        effects:
          - bumpRetry: task.id
      - from: verify
        to: done
        guard: "task.gates.review == 'passed' && task.gates.qa == 'passed'"
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
