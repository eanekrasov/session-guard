extends: 'verify-default/cycle.yaml'
# A failed verification sends the task back to verify rather than to code.
stages:
  execution:
    transitions:
      - from: code
        to: verify
      - from: verify
        to: verify
        guard: "task.gates.review == 'failed' || task.gates.qa == 'failed'"
        effects:
          - bumpRetry: task.id
      - from: verify
        to: done
        guard: "task.gates.review == 'passed' && task.gates.qa == 'passed'"
