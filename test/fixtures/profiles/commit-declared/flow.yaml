# Профиль объявляет СВОЮ команду доставки. Тест проверяет, что опознание
# вызова принадлежит схеме, а не имени команды, зашитому в ядре.
stages:
  planning: {}
  commit:
    actions:
      - action: bash
        commands: ['deliver .*']
        delivers: true
  done: {}
transitions:
  - from: planning
    to: commit
  - from: commit
    to: done
    guard: 'session.deliveryReceipt != null'
