gates:
  - id: invariants
  - id: review
  - id: qa
stages:
  planning:
    dispatch:
      strategy: serial
  tasks_ready: {}
  execution:
    loop: implementation
    dispatch:
      strategy: serial_with_overlap
      maxConcurrent: 2
    stages:
      code:
        allowedAgents: ['code']
      verify:
        allowedAgents: ['architect']
        gates: ['invariants', 'review']
    transitions:
      - from: code
        to: verify
        kind: pass
      - from: verify
        to: done
        kind: pass
      - from: verify
        to: code
        kind: fail
        effects:
          - bumpRetry: task.id
  commit: {}
  done: {}
transitions:
  - from: planning
    to: tasks_ready
    guard: "session.approved('plan')"
  - from: tasks_ready
    to: execution
    guard: 'hasPendingTasks()'
  - from: execution
    to: commit
    guard: 'allTasksCompleted()'
  - from: commit
    to: done
    guard: "typeof session.deliveryReceipt == 'string' || typeof session.deliveryPermit == 'string'"
gateMapping:
  review: ['invariants', 'review']
settings:
  mutationTtlMs: 1800000
  retryMaxAttempts: 3
stageAssignments:
  - id: default
    priority: 0
    condition: 'true'
    result: planning
  - id: hasPlanApproval
    priority: 60
    condition: "session.approved('plan')"
    result: tasks_ready
  - id: uncommitted
    priority: 70
    condition: "session.approved('plan') && (session.taskLists.implementation ?? []).length > 0 && session.taskLists.implementation.some(t => t.status != 'completed')"
    result: execution
  - id: commitApproval
    priority: 90
    condition: "session.approved('commit')"
    result: commit
  - id: deliveryReceipt
    priority: 100
    condition: "typeof session.deliveryReceipt == 'string' || typeof session.deliveryPermit == 'string'"
    result: done
actionGuards:
  beginMutation: "session.approved('plan')"
requiredGates:
  - invariants
  - review
  - qa
