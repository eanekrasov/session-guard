extends: 'verify-default/cycle.yaml'
# The full task cycle: verify goes on to commit when both verdicts pass, and
# back to code when either fails, spending the task's own budget.
stages:
  execution:
    stages:
      commit: {}
    transitions:
      - from: code
        to: verify
      - from: commit
        to: done
      - from: verify
        to: commit
        guard: "task.gates.review == 'passed' && task.gates.qa == 'passed'"
      - from: verify
        to: code
        guard: "task.gates.review == 'failed' || task.gates.qa == 'failed'"
        effects:
          - bumpRetry: task.id
