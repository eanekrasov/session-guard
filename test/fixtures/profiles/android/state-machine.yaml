extends: 'base/state-machine.yaml'
stages:
  PLANNING:
    dispatch:
      strategy: serial
  EXECUTION:
    dispatch:
      strategy: serial_with_overlap
      maxConcurrent: 2
    stages:
      compile:
        allowedAgents: ['code']
        entryGuards: ["session.approved('plan')"]
        exitGuards: ["session.activeOperations.some(o => o.result == 'output_ready')"]
gateMapping:
  review: ['invariants']
  build: ['compile', 'test']
settings:
  mutationTtlMs: 600000
