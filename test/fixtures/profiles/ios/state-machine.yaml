extends: 'base/state-machine.yaml'
stages:
  execution:
    stages:
      build:
        allowedAgents: ['code']
        exitGuards:
          - "session.activeOperations.some(o => o.result == 'output_ready')"
          - "session.testStatus['build'] == 'pass'"
actionGuards:
  beginMutation: "session.approved('plan')"
editingAgents: ['code']
verifiers: ['architect']
