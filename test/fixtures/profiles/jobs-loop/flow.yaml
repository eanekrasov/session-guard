# The task list is `jobs`, not `implementation`.
#
# `workflow.tasks-set` defaulted its listKey to the literal `implementation` —
# the base profile's loop source written into the core — so this workflow was
# refused with "Unknown task list: implementation" and could never be started:
# no run exists until tasks are dispatched, and no tasks could be set without a
# run.
stages:
  planning: {}
  execution:
    loop: jobs
    stages:
      code: {}
    transitions:
      - from: code
        to: done
  done: {}
transitions:
  - from: planning
    to: execution
  - from: execution
    to: done
