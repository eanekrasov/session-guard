stages:
  execution:
    loop: implementation
    dispatch:
      strategy: serial
    retryBudget:
      maximum: 3
    stages:
      code:
        allowedAgents: ['code']
      verify:
        allowedAgents: ['reviewer', 'tester']
        gates: [review, qa]
stageAssignments:
  - id: execution
    priority: 1
    condition: 'true'
    result: execution
