# test/fixtures/presets/medium.yaml
# State machine config for medium (review without QA).

stages:
  PLANNING: {}

  TASKS_READY: {}

  EXECUTION:
    dispatch:
      strategy: serial
    stages:
      dev:
        allowedAgents:
          - code
          - debug
        entryGuards: []
        exitGuards:
          - "session.gatePassed('invariants')"
      review:
        allowedAgents:
          - review
        entryGuards:
          - "session.activeMutation?.outputReady == true"
        exitGuards:
          - "session.gatePassed('review')"

  COMMIT: {}

  DONE: {}

transitions:
  - from: PLANNING
    to: TASKS_READY
    guard: "session.approved('plan') == true && (session.taskLists.implementation ?? []).length == 0"
  - from: PLANNING
    to: EXECUTION
    guard: "session.approved('plan') == true && (session.taskLists.implementation ?? []).length > 0"
  - from: PLANNING
    to: COMMIT
    guard: "session.deliveryPermit != null"
  - from: TASKS_READY
    to: EXECUTION
    guard: "(session.taskLists.implementation ?? []).length > 0"
  - from: EXECUTION
    to: COMMIT
    kind: pass
  - from: COMMIT
    to: DONE
    guard: "session.deliveryReceipt != null"

gateMapping:
  dev:        []
  test:       [invariants]
  review:     [review]

settings:
  stall:
    thresholdMs: 300000
    action: notify
    maxRetries: 3
  mutationTtlMs: 1800000
  verifierTtlMs: 1800000

defaultManifest:
  - dev
  - review

actionGuards:
  beginMutation: 'session.approved("plan")'
