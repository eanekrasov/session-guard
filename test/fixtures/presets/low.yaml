# test/fixtures/presets/low.yaml
# State machine config for low (minimal, no formal review).

stages:
  PLANNING: {}

  EXECUTION:
    dispatch:
      strategy: serial
    stages:
      dev:
        allowedAgents:
          - code
        entryGuards: []
        exitGuards:
          - "session.gatePassed('invariants')"

  COMMIT: {}

  DONE: {}

transitions:
  - from: PLANNING
    to: EXECUTION
    guard: 'session.approved("plan")'
  - from: EXECUTION
    to: COMMIT
    kind: pass
    guard: "session.gatePassed('invariants')"
  - from: COMMIT
    to: DONE
    guard: "session.deliveryReceipt != null"

gateMapping:
  dev:        []
  verify:     []

settings:
  stall:
    thresholdMs: 120000
    action: notify
    maxRetries: 2
  mutationTtlMs: 1800000
  verifierTtlMs: 1800000

defaultManifest:
  - dev
