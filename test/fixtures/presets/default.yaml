# test/fixtures/presets/default.yaml
# YAML source of truth for deriveStage rules.
# Loaded by tests to validate engine behavior.
# Adapted from parent state-machine/config/presets/default.yaml
# with generalized field names per AGENTS.md.

stages:
  - PLANNING
  - TASKS_READY
  - EXECUTION
  - COMMIT
  - DONE

deriveStageRules:
  - id: deliveryReceipt
    priority: 100
    condition: "session.deliveryReceipt exists"
    result: DONE

  - id: deliveryPermit
    priority: 90
    condition: "session.deliveryPermit exists"
    result: COMMIT

  - id: architectActive
    priority: 80
    condition: "session.activeMutation agentIs architect"
    result: PLANNING

  - id: uncommitted
    priority: 70
    condition: 'session.approved("plan") equals true && session.taskLists.implementation contains:status:false'
    result: EXECUTION

  - id: planApproved
    priority: 60
    condition: 'session.approved("plan") equals true'
    result: TASKS_READY

  - id: default
    priority: 0
    condition: "always"
    result: PLANNING
