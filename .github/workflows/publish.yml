name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (latest or next)
        required: true
        default: latest
  repository_dispatch:
    types: [publish-package]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Tooling
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: false
          experimental: true

      # npm-токены не нужны: npm CLI обменивает OIDC-токен GitHub Actions
      # (permission id-token: write) на краткоживущий publish-токен.
      # Требует, чтобы publish.yml был указан доверенным издателем на npmjs.com.
      - name: Publish
        run: mise run publish --tag "${{ github.event.client_payload.tag || inputs.tag || 'latest' }}"
