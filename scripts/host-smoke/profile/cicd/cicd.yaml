# CI/CD pipeline profile — a complete pipeline from init through deploy.
#
# Completely standalone — does NOT inherit base.yaml.
# Tests: entryGuards, exitGuards, alternative transitions, consent on transitions,
#        retry budget, gate-based task movement, verification recording.
#
# Pipeline:
#   init ──guard + consent──→ checkout ──→ build ──→ test(suite) ──→ deploy ──→ smoke ──→ done
#                                                     │   ↑                     │
#                                                     │   │                     │
#                               fail (retry up to 3)──┘   └── fail (rollback)───┘
#
# Stage types:
#   init, checkout, build, deploy, smoke, done — flat stages
#   test — loop over a suite of test tasks (unit, integration)

stages:
  init:
    allowedAgents: [orchestrator]

  checkout:
    allowedAgents: [setup, orchestrator]
    gates: [checkout_done]

  build:
    allowedAgents: [builder, orchestrator]
    gates: [build_done]
    # P2.1: entryGuards — не пускает в build, пока checkout gate не passed
    entryGuards:
      - "session.gates.checkout_done == 'passed'"

  test:
    loop: test_suite
    dispatch:
      strategy: serial
    retryBudget:
      maximum: 3
    # P2.2: exitGuards на loop stage. Они проверяются на уровне СЕССИИ
    # (`engine.ts`: `toGuardContext(session)` без задачи), поэтому `task.*`
    # здесь не существует — выражение про гейты задачи всегда было ложным и
    # держало стадию закрытой навсегда. Сессионный факт того же смысла: пока
    # хоть одна задача в работе, из `test` не уходим.
    exitGuards:
      - '!hasPendingTasks()'
    stages:
      unit:
        allowedAgents: [tester, orchestrator]
        gates: [unit]

      integration:
        allowedAgents: [tester, orchestrator]
        gates: [integration]

  deploy:
    allowedAgents: [deployer, orchestrator]
    gates: [deploy_done]
    # P2.4: entryGuards — не пускает в deploy, пока тесты не пройдены. Тоже
    # сессионный уровень: спрашиваем список задач, а не гейты одной из них.
    entryGuards:
      - "allTasksCompleted('test_suite')"

  smoke:
    allowedAgents: [smoke, orchestrator]
    gates: [smoke_result]

  done: {}

transitions:
  - from: init
    to: checkout
    guard: 'session.refs.plan != null'
    consent: plan

  - from: checkout
    to: build
    guard: "session.gates.checkout_done == 'passed'"

  # P3: альтернативные переходы build → test
  # Оба ведут в test, с разными conditions
  - from: build
    to: test
    guard: "session.gates.build_done == 'passed'"

  - from: build
    to: test
    guard: "session.gates.build_done == 'failed'"

  # P1.4: fail-переход с retry — тесты не пройдены, перезапуск
  - from: test
    to: build
    guard: "!allTasksCompleted('test_suite') && !isExhausted('cycles')"
    effects:
      - bumpRetry: cycles
        maxAttempts: 3

  - from: test
    to: deploy
    guard: "allTasksCompleted('test_suite')"

  # Consent на переходе deploy → smoke (P1.2)
  - from: deploy
    to: smoke
    guard: "session.gates.deploy_done == 'passed'"
    consent: deploy

  # Rollback: если deploy не удался — возврат в build
  - from: deploy
    to: build
    guard: "session.gates.deploy_done == 'failed'"

  - from: smoke
    to: done
    guard: "session.gates.smoke_result == 'passed'"

# Правил назначения стадии здесь нет намеренно.
#
# Раньше стояло одно: `condition: 'true'` → `init`. Условие истинно всегда, так
# что `deriveStage` возвращал `init` при любом состоянии, а `applyTransitions`
# на каждом ходу заново брал ребро `init → checkout`. Сессия доезжала до
# `checkout` и оставалась там навсегда: гейт `checkout_done` был закрыт, а
# переход `checkout → build` не рассматривался вовсе — стадией считалась не та,
# в которой сессия стоит. Без правил `deriveStage` отвечает `currentStage`, и
# для прямого конвейера это ровно то, что нужно.

editingAgents:
  - setup
  - builder
  - deployer
  - orchestrator
