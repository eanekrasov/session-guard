# Delta over base/base.yaml for the host smoke run.
#
# The state machine is inherited unchanged — that is the point of the run. Only
# the agent roster is pinned to what the host actually dispatches, so the
# scenarios exercise the shipped stages rather than a toy machine.
#
# Merger rule: schemas merge at the top level only. Redeclaring a stage key
# (e.g. `execution`) replaces that stage entirely — its nested `stages`,
# `transitions`, `gates`, `actions` — nothing is deep-merged. Loops, transitions,
# and nested rosters inherited from base must be repeated in full when a stage
# is redeclared; an incomplete set leaves the workflow uncompilable.

extends: 'base/base.yaml'

stages:
  planning:
    allowedAgents: [orchestrator]
  tasks_ready:
    allowedAgents: [orchestrator]
  execution:
    loop: implementation
    stages:
      code:
        allowedAgents: [coder, orchestrator]
      verify:
        allowedAgents: [reviewer, tester]
        gates: [review, qa]
    transitions:
      # Base guards this edge on the invariants gate. A subagent's edits are
      # made in its own session, and the plugin does not link a child session
      # to its parent, so the parent's invariants gate never turns green from
      # delegated work. This run is about the
      # verifier gates, so the edge is refined to move on the coder's own result.
      - from: code
        to: verify
      - from: verify
        to: done
        guard: "task.gates.review == 'passed' && task.gates.qa == 'passed'"
      - from: verify
        to: code
        guard: "task.gates.review == 'failed' || task.gates.qa == 'failed'"
        effects:
          - bumpRetry: task.id
  validation:
    allowedAgents: [reviewer, tester]
    gates: [review, qa]

editingAgents:
  - coder
  - orchestrator
