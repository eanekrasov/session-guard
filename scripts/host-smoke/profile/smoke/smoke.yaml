# Delta over base/base.yaml for the host smoke run.
#
# The state machine is inherited unchanged — that is the point of the run. Only
# the agent roster is pinned to what the host actually dispatches, so the
# scenarios exercise the shipped stages rather than a toy machine.
#
# `base` declares no rosters (see profiles/base/base.yaml), so they are named
# here. Stages merge entry by entry, so naming `execution` again keeps the loop
# and transitions it inherits.
#
# The `extends` below is what makes that inheritance happen. A profile's
# schemas became its own — combining is schema-level only — and this delta was
# left behind: on its own it declares an `execution` loop whose only edge is
# `code → verify`, so nothing reaches `done` and the workflow does not compile.
# `workflow-create` then returned a configuration error and persisted no
# session at all, which is what the `create` scenario reported.

extends: 'base/base.yaml'

stages:
  planning:
    allowedAgents: [orchestrator]
  tasks_ready:
    allowedAgents: [orchestrator]
  execution:
    loop: implementation
    stages:
      code:
        allowedAgents: [coder, orchestrator]
      verify:
        allowedAgents: [reviewer, tester]
        gates: [review, qa]
    transitions:
      # Base guards this edge on the invariants gate. A subagent's edits are
      # made in its own session, and the plugin does not link a child session
      # to its parent, so the parent's invariants gate never turns green from
      # delegated work. This run is about the
      # verifier gates, so the edge is refined to move on the coder's own result.
      - from: code
        to: verify
  validation:
    allowedAgents: [reviewer, tester]
    gates: [review, qa]

editingAgents:
  - coder
  - orchestrator
