# Android profile — delta over base/base.yaml.
#
# Only what differs from the base workflow is declared here; everything else
# (gates, stages, transitions, guards) is inherited. Resolution order is
# parent-then-child, so these values win.
#
# There is deliberately no workflow of its own here. Android does not run a
# different state machine — it runs the base one with a bigger agent roster and
# its own invariants. A copy of the stages and transitions would be a second
# workflow to keep in step with the first, and that is exactly what went wrong:
# the stage model renamed `phases:` to `stages:` and rewrote base.yaml around
# the `execution` loop (docs/stage-model.md), and this file was left behind on
# both counts. Its `phases:` block stopped being read the day of the rename,
# and every transition it declared named a stage — code, review, qa — that no
# longer existed.
#
# NOTE: `allowedAgents` on an outer stage is not declared here because nothing
# reads it. It is enforced at task admission (src/app/runtime.ts), which
# resolves the roster as `stage.allowedAgents ?? loopStage.allowedAgents` — a
# stage inside a loop. The other reader, `mayVerify`, returns early for a stage
# that declares no gates. `planning` has neither a loop nor gates, so the
# `allowedAgents: ['architect']` this file carried before the rename would be
# inert under the new key rather than restored, and is deliberately left out.
#
# Restricting who may run is also not what planning needs: `allowedAgents` says
# who is permitted once dispatched, and dispatch itself is read only as
# `loopStage.dispatch`. Launching the architect on planning is a capability the
# workflow does not have yet — see docs/plans/.
#
# Task-stage-level `allowedAgents` (see task-cycles.yaml) uses the dispatched
# agent and does work.
#
# Format: ProfileSchema (src/schema/profile-schema.ts).

# Combines with the base workflow through `extends` — the only way two
# schemas ever become one.
extends: 'base/base.yaml'

# ─── Editing agents ───────────────────────────────────────────────────────────
# The android roster, which is what this profile is for.
editingAgents:
  - code
  - debug
  - architect
  - figma

# ─── Verifiers ────────────────────────────────────────────────────────────────
verifiers:
  - review
  - qa

# ─── Settings ─────────────────────────────────────────────────────────────────
settings:
  enableDashboard: false
