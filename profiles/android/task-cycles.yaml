# Unregistered example of a declarative task-cycle profile schema.
# It is intentionally not referenced by profiles/android/profile.json.
stages:
  execution:
    loop: implementation
    retryBudget:
      maximum: 3
    dispatch:
      strategy: parallel
      maxConcurrent: 3
    stages:
      dev:
        allowedAgents: [code, debug]
      review:
        allowedAgents: [review]
      qa:
        allowedAgents: [qa]
    exitGuards:
      - 'allTasksCompleted()'

  done: {}
  failed: {}

transitions:
  - from: execution
    to: execution
    kind: fail
    onFailure: retry
  - from: execution
    to: done
    kind: pass
  - from: execution
    to: failed
    kind: fail
    onFailure: terminal
