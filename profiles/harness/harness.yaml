# Harness self-edit profile — delta over base/base.yaml.
#
# Only what differs from the base workflow is declared here; everything else
# (stages, transitions, guards) is inherited. Resolution order is
# parent-then-child, so these values win.
#
# NOTE: stage-level `allowedAgents` is deliberately NOT declared. It is checked
# at task admission, against a nested stage's roster or its parent's, so a
# stage without `stages` never reaches the check and a roster there is inert —
# not dangerous, just unread. See profiles/README.md, "Known traps".

# Combines with the base workflow through `extends` — the only way two
# schemas ever become one.
extends: 'base/base.yaml'

# The harness profile ships a single agent, so it is also the one allowed to
# drive workflow task state. Every other profile defaults to `orchestrator`.
taskControlAgents:
  - harness

editingAgents:
  - harness

verifiers:
  - harness
