<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Machine Dashboard</title>
<!-- Mermaid отключён (CDN недоступен). Граф рендерится inline SVG через renderGraph() -->
<style>
:root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --dim: #8b949e;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #58a6ff; --purple: #bc8cff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; padding:16px; }
h1 { font-size:18px; margin-bottom:16px; color:var(--blue); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:900px) { .grid { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; }
.card h2 { font-size:14px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
.state-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-weight:700; font-size:13px; }
/* Class names are built as "state-" + the stage id, and a stage id is
   lowercase as the profile writes it. These were uppercase, so no badge was
   ever styled. */
.state-planning { background:#1a2a3a; color:var(--blue); }
.state-tasks_ready { background:#2a2a1a; color:var(--yellow); }
.state-execution { background:#1a3a2a; color:var(--green); }
.state-validation { background:#2a1a3a; color:var(--purple); }
.state-commit { background:#3a1a1a; color:var(--red); }
.state-done { background:#1a3a2a; color:var(--green); }
.state-failed { background:#3a1a1a; color:var(--red); }
.inv-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border); }
.inv-row:last-child { border-bottom:none; }
.inv-pass { color:var(--green); } .inv-fail { color:var(--red); } .inv-pending { color:var(--yellow); }
.file-list { font-size:12px; max-height:200px; overflow-y:auto; }
.file-item { padding:2px 0; color:var(--dim); border-bottom:1px solid #1a1f2a; }
.cycle-counter { font-size:24px; font-weight:700; text-align:center; padding:12px; border-radius:8px; }
.cycle-ok { color:var(--green); } .cycle-warn { color:var(--yellow); } .cycle-danger { color:var(--red); background:#3a1a1a; }
.timeline { max-height:300px; overflow-y:auto; font-size:12px; }
.tl-item { padding:4px 8px; margin:2px 0; border-radius:4px; display:flex; gap:8px; }
.tl-green { background:#1a3a2a; } .tl-red { background:#3a1a1a; } .tl-yellow { background:#3a2a1a; } .tl-blue { background:#1a2a3a; }
.tl-time { color:var(--dim); white-space:nowrap; font-family:monospace; }
button { background:var(--border); color:var(--text); border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
button:hover { background:#484f58; }
#status { font-family:monospace; font-size:11px; color:var(--dim); margin-top:8px; }
</style>
<style>
/* Светлая тема */
body.light { --bg: #ffffff; --card: #f6f8fa; --border: #d0d7de; --text: #1f2328; --dim: #656d76;
  --green: #1a7f37; --red: #cf222e; --yellow: #9a6700; --blue: #0969da; --purple: #8250df; }
body.light .state-planning { background:#ddf4ff; color:var(--blue); }
body.light .state-tasks_ready { background:#fff8c5; color:var(--yellow); }
body.light .state-execution { background:#dafbe1; color:var(--green); }
body.light .state-validation { background:#fbefff; color:var(--purple); }
body.light .state-commit { background:#ffebe9; color:var(--red); }
body.light .state-done { background:#dafbe1; color:var(--green); }
body.light .state-failed { background:#ffebe9; color:var(--red); }
body.light .tl-green { background:#dafbe1; } body.light .tl-red { background:#ffebe9; }
body.light .tl-yellow { background:#fff8c5; } body.light .tl-blue { background:#ddf4ff; }
body.light .cycle-danger { background:#ffebe9; }
body.light .file-item { border-bottom-color:#d0d7de; }
body.light button:hover { background:#d0d7de; }
.theme-btn { position:absolute; top:16px; right:16px; font-size:18px; background:var(--card); border:1px solid var(--border); border-radius:8px; cursor:pointer;   padding:6px 10px; }
.session-bar { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.session-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text); white-space:nowrap; }
.session-chip:hover { border-color:var(--blue); }
.session-chip.active { border-color:var(--blue); background:var(--blue); color:#fff; }
.session-chip .chip-state { font-size:10px; opacity:0.8; }
.session-chip .chip-time { font-size:10px; opacity:0.6; }
.sess-count { font-size:11px; color:var(--dim); }
</style>
</head>
<body>

<h1>⚙️ State Machine Dashboard <span id="status">— нет подключения</span></h1>
<button class="theme-btn" onclick="toggleTheme()" title="Сменить тему">🌙</button>

<div class="session-bar">
  <span class="sess-count" id="sess-count">0 сессий</span>
  <div id="session-chips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
</div>

<div class="grid">
  <div class="card">
    <h2>📌 Текущее состояние</h2>
    <div id="state-badge"><span class="state-badge">—</span></div>
    <div style="margin-top:6px;color:var(--dim);font-size:12px" id="state-detail"></div>
  </div>
  <div class="card">
    <h2>🔄 Счётчик циклов</h2>
    <div class="cycle-counter cycle-ok" id="cycle-counter">0</div>
    <div id="cycle-label" style="text-align:center;font-size:11px;color:var(--dim);margin-top:4px;"></div>
  </div>
  <div class="card">
    <h2>✅ Инварианты</h2>
    <div id="invariants">—</div>
  </div>
  <div class="card">
    <h2>📁 Scope изменений</h2>
    <div class="file-list" id="changed-files">—</div>
  </div>
  <div class="card" style="grid-column:1/-1;">
    <h2>🗺️ Граф состояний</h2>
      <div id="graph-container" style="background:var(--bg);border-radius:6px;padding:10px;min-height:300px;">
        <svg id="graph-svg" width="100%" height="300"></svg>
      </div>
  </div>
  <div class="card" style="grid-column:1/-1;">
    <h2>📋 Timeline</h2>
    <div class="timeline" id="timeline">Ожидание событий...</div>
  </div>
  <div class="card" style="grid-column:1/-1;">
    <h2>🎛️ Control Panel</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="dumpState()">📄 Dump State</button>
      <button onclick="reloadGraph()">🔄 Reload Graph</button>
    </div>
    <pre id="dump-output" style="display:none;margin-top:8px;font-size:11px;max-height:300px;overflow:auto;background:#0d1117;padding:8px;border-radius:6px;"></pre>
  </div>
</div>

<script>
// Встроенный рендеринг графа (без Mermaid)
function renderGraphSVG(active, states, transitions, history) {
  const svg = document.getElementById("graph-svg");
  const w = svg.clientWidth || 800;
  const h = svg.clientHeight || 300;
  const nodeR = 24;
  const gapX = Math.max(100, Math.floor(w / (states.length + 1)));
  const cy = h / 2 - 20;

  const visited = new Set((history || []).map(h => h.state));
  const isDark = localStorage.getItem("theme") !== "light";
  const colors = isDark
    ? { active: "#238636", activeText: "#fff", visited: "#1a3a2a", visitedText: "#3fb950", normal: "#161b22", normalText: "#8b949e", line: "#30363d", lineActive: "#3fb950" }
    : { active: "#1a7f37", activeText: "#fff", visited: "#dafbe1", visitedText: "#1a7f37", normal: "#f6f8fa", normalText: "#656d76", line: "#d0d7de", lineActive: "#1a7f37" };

  let html = '';
  for (let i = 0; i < states.length; i++) {
    const st = states[i];
    const cx = gapX * (i + 1);
    const isA = st === active;
    const isV = visited.has(st);
    const fill = isA ? colors.active : isV ? colors.visited : colors.normal;
    const txt = isA ? colors.activeText : isV ? colors.visitedText : colors.normalText;
    html += `<circle cx="${cx}" cy="${cy}" r="${nodeR}" fill="${fill}" stroke="${isA ? colors.lineActive : colors.line}" stroke-width="${isA ? 2.5 : 1.5}"/>`;
    html += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="${txt}" font-size="11" font-weight="${isA ? 'bold' : 'normal'}" font-family="sans-serif">${st}</text>`;

    if (i < states.length - 1) {
      const nx = gapX * (i + 2);
      const marker = isA || isV || visited.has(states[i+1]) ? 'active' : 'dim';
      const lc = marker === 'active' ? colors.lineActive : colors.line;
      const x1 = cx + nodeR + 3;
      const y1 = cy;
      const x2 = nx - nodeR - 3;
      const y2 = cy;
      html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lc}" stroke-width="${marker === 'active' ? 2 : 1}" marker-end="url(#arrow-${marker})"/>`;
    }
  }

  html = `<defs>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="${colors.lineActive}"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="${colors.line}"/>
    </marker>
  </defs>${html}`;

  svg.innerHTML = html;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
}

let GRAPH_STATES = [];
let GRAPH_TRANSITIONS = [];
let currentState = "";
let history = [];

async function loadSchema() {
  try {
    const resp = await fetch("/api/schema");
    const schema = await resp.json();
    GRAPH_STATES = schema.states.map(s => s.id);
    GRAPH_TRANSITIONS = schema.transitions.map(t => [t.from, t.to]);
    renderGraph(currentState || (GRAPH_STATES[0] || "planning"));
  } catch {}
}

async function renderGraph(active) {
  if (!active) active = GRAPH_STATES[0] || "—";
  renderGraphSVG(active, GRAPH_STATES, GRAPH_TRANSITIONS, history);
}

function reloadGraph() {
  renderGraph(currentState || GRAPH_STATES[0] || "—");
}

// Тема
let isDark = localStorage.getItem("theme") !== "light";
function applyTheme() {
  document.body.classList.toggle("light", !isDark);
  document.querySelector(".theme-btn").textContent = isDark ? "☀️" : "🌙";
  if (typeof renderGraph === 'function') reloadGraph();
}
function toggleTheme() { isDark = !isDark; localStorage.setItem("theme", isDark ? "dark" : "light"); applyTheme(); }
applyTheme();

const evtSource = new EventSource("/events");

evtSource.onopen = () => {
  document.getElementById("status").textContent = "● онлайн";
  document.getElementById("status").style.color = "var(--green)";
};

evtSource.onerror = () => {
  document.getElementById("status").textContent = "○ переподключение...";
  document.getElementById("status").style.color = "var(--red)";
};

let allSessions = {};
let selectedSessionId = null;

function pickBestSession() {
  const ids = Object.keys(allSessions);
  if (ids.length === 0) return null;
  // Сначала ищем не-DONE сессии
  const active = ids.filter(id => (allSessions[id].stage || allSessions[id].state) !== "DONE");
  if (active.length > 0) {
    return active.sort((a, b) => (allSessions[b].updatedAt || "").localeCompare(allSessions[a].updatedAt || ""))[0];
  }
  // Если все DONE — берём последнюю обновлённую
  return ids.sort((a, b) => (allSessions[b].updatedAt || "").localeCompare(allSessions[a].updatedAt || ""))[0];
}

function renderSessionChips() {
  const container = document.getElementById("session-chips");
  const ids = Object.keys(allSessions).sort((a, b) => (allSessions[b].updatedAt || "").localeCompare(allSessions[a].updatedAt || ""));
  document.getElementById("sess-count").textContent = ids.length + " сессий";
  container.textContent = "";
  for (const id of ids) {
    const s = allSessions[id];
    const st = s.stage || s.state || "—";
    const time = (s.updatedAt || "").slice(11, 19) || "";
    const displayName = (s.title && s.title.length > 0) ? s.title : (id.length > 20 ? id.slice(0, 18) + "…" : id);
    const chip = document.createElement("div");
    chip.className = "session-chip" + (id === selectedSessionId ? " active" : "");
    chip.dataset.sid = id;
    chip.addEventListener("click", () => selectSession(id));
    const stateSpan = document.createElement("span");
    stateSpan.className = "state-badge state-" + st;
    stateSpan.style.cssText = "padding:1px 6px;font-size:10px;";
    stateSpan.textContent = st;
    chip.appendChild(stateSpan);
    const nameSpan = document.createElement("span");
    nameSpan.textContent = displayName;
    chip.appendChild(nameSpan);
    const timeSpan = document.createElement("span");
    timeSpan.className = "chip-time";
    timeSpan.textContent = time;
    chip.appendChild(timeSpan);
    container.appendChild(chip);
  }
}

async function selectSession(id) {
  selectedSessionId = id;
  history = [];
  let s = allSessions[id];
  if (!s) {
    try {
      const resp = await fetch("/api/session/" + encodeURIComponent(id));
      if (resp.ok) s = await resp.json();
    } catch {}
  }
  if (s) {
    currentState = s.stage || GRAPH_STATES[0] || "—";
    updateUI(s);
  }
  renderSessionChips();
}

evtSource.onmessage = (e) => {
  try {
    const data = JSON.parse(e.data);
    if (data.snapshot) {
      allSessions = data.snapshot;
      if (!selectedSessionId || !allSessions[selectedSessionId]) {
        selectedSessionId = pickBestSession();
      } else {
        // Обновить данные выбранной сессии
        const updated = allSessions[selectedSessionId];
        if (updated && (updated.stage || updated.state) !== currentState) {
          updateUI(updated);
        }
      }
      renderSessionChips();
      if (selectedSessionId && allSessions[selectedSessionId]) {
        updateUI(allSessions[selectedSessionId]);
      }
      return;
    }
    if (data.rootSessionID) {
      allSessions[data.rootSessionID] = data;
      if (data.rootSessionID === selectedSessionId) updateUI(data);
      renderSessionChips();
    }
    if (data.event) addTimelineEvent(data.event);
  } catch {}
};

function updateUI(session) {
  if (!session) return;
  const st = session.stage || session.state || "—";
  currentState = st;
  const badge = document.getElementById("state-badge");
  badge.textContent = "";
  const span = document.createElement("span");
  span.className = "state-badge state-" + st;
  span.textContent = st;
  badge.appendChild(span);
  const detail = document.getElementById("state-detail");
  detail.textContent = "id: " + (session.rootSessionID || "").slice(0,30) + " | revision: " + (session.revision ?? "—") + " | updated: " + ((session.updatedAt || "").slice(11,19) || "—");
  const fc = Object.values(session.retryBudgets || {}).reduce((total, budget) => total + (budget?.attempts ?? 0), 0);
  const cycleEl = document.getElementById("cycle-counter");
  const cycleLabel = document.getElementById("cycle-label");
  cycleEl.textContent = fc;
  cycleEl.className = "cycle-counter";
  if (fc >= 2) { cycleEl.classList.add("cycle-danger"); cycleLabel.textContent = "⚠️ Близка блокировка мутаций"; }
  else if (fc >= 1) { cycleEl.classList.add("cycle-warn"); cycleLabel.textContent = "Один откат"; }
  else { cycleEl.classList.add("cycle-ok"); cycleLabel.textContent = "Всё чисто"; }
  // Нормализуем gates: из массива [{id,status}] в Record<id, status>
  const gatesMap = {};
  if (Array.isArray(session.gates)) {
    for (const g of session.gates) { if (g.id) gatesMap[g.id] = g.status || "pending"; }
  } else if (session.gates && typeof session.gates === "object") {
    Object.assign(gatesMap, session.gates);
  }
  const invEl = document.getElementById("invariants");
  invEl.innerHTML = "";
  for (const [key, label] of [["invariants","Инварианты кода"],["review","Code Review"],["qa","QA-верификация"]]) {
    const v = gatesMap[key] || "pending";
    const cls = v === "pass" ? "inv-pass" : v === "fail" ? "inv-fail" : "inv-pending";
    const icon = v === "pass" ? "✅" : v === "fail" ? "❌" : "⏳";
    const row = document.createElement("div");
    row.className = "inv-row";
    row.innerHTML = `<span>${label}</span><span class="${cls}">${icon} ${v}</span>`;
    invEl.appendChild(row);
  }
  const filesEl = document.getElementById("changed-files");
  filesEl.innerHTML = "";
  const cf = session.changedFiles || [];
  if (cf.length === 0) { filesEl.innerHTML = "<span style='color:var(--dim)'>Нет изменений</span>"; }
  else { for (const f of cf) { const item = document.createElement("div"); item.className = "file-item"; item.textContent = f; filesEl.appendChild(item); } }
  if (history.length === 0 || history[history.length-1].state !== st) {
    history.push({ state: st, ts: new Date().toISOString() });
    addTimelineEvent({ ts: new Date().toISOString(), type: "transition", detail: "Состояние → " + st, color: "green" });
  }
  renderGraph(st);
}

function addTimelineEvent(ev) {
  const tl = document.getElementById("timeline");
  if (tl.children.length === 1 && tl.children[0].textContent === "Ожидание событий...") tl.innerHTML = "";
  const item = document.createElement("div");
  item.className = `tl-item tl-${ev.color||"blue"}`;
  const time = ev.ts ? ev.ts.slice(11,19) : "--:--:--";
  item.innerHTML = `<span class="tl-time">${time}</span><span>${ev.detail}</span>`;
  tl.insertBefore(item, tl.firstChild);
  if (tl.children.length > 50) tl.removeChild(tl.lastChild);
}

async function dumpState() {
  const el = document.getElementById("dump-output");
  el.style.display = "block";
  el.textContent = "Загрузка...";
  try {
    const resp = await fetch("/api/dump");
    const json = await resp.json();
    el.textContent = JSON.stringify(json, null, 2);
  } catch (err) {
    el.textContent = "Ошибка: " + err.message;
  }
}

loadSchema();
</script>
</body>
</html>
